extends: final.yaml  # 继承公共配置，相对当前 YAML 路径
sampling_ratio: 0.01  # 有效差分测量数占像素数的比例，预算向下取整（512×512 时 M=2621）
run:  # 单个任务的运行参数
  template: SET11_512  # 使用的原生尺寸模板
  dataset_root: data/set11_proxunroll/native  # 原生 Y 通道数据目录，相对项目根目录
  image_ids:  # 本任务显式图像清单
  - fingerprint  # 列表成员：图像编号或解析后的参数覆盖
  - flinstones  # 列表成员：图像编号或解析后的参数覆盖
  split: test  # 数据划分，测试数据不得用于调参
  device: cuda:0  # 单任务仅使用这张 GPU
  output: outputs/generalization/set11_512  # 本实验独立结果目录
  ablation: full  # 模板解析后应用的预设消融
