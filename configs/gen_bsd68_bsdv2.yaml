extends: final.yaml  # 继承公共配置，相对当前 YAML 路径
sampling_ratio: 0.01  # 有效差分测量数占像素数的比例，预算向下取整
run:  # 单个任务的运行参数
  template: BSD68_481x321_bsdv2  # 使用的原生尺寸模板
  dataset_root: data/bsd68_proxunroll/native  # 原生 Y 通道数据目录，相对项目根目录
  count: 68  # 按固定清单顺序运行的图像数量
  split: test  # 数据划分，测试数据不得用于调参
  device: cuda:0  # 单任务仅使用这张 GPU
  output: outputs/generalization/bsd68_bsdv2  # 本实验独立结果目录
  ablation: full  # 模板解析后应用的预设消融
